version: 2

models:
  - name: fct_velib_availability
    description: "Table finale de reporting sur la disponibilité temps réel des Vélib par station."
    columns:
      - name: station_id
        description: "Identifiant unique de la station Vélib."
        data_tests:
          - unique
          - not_null

      - name: availability_rate_pct
        description: "Taux de disponibilité des vélos en pourcentage."
        data_tests:
          - not_null

      - name: station_status
        description: "Statut opérationnel : Rupture (0 vélo), Saturée (0 bornette libre) ou Nominale."
        data_tests:
          - not_null
          - accepted_values:
              values: ['Nominale', 'Rupture', 'Saturée']